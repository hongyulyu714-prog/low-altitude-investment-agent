name: Frontend V1
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'backend/main.py'
      - 'backend/orchestrator.py'
      - 'data/mock/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: ['feat/frontend-*']
    paths: ['frontend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  platform:
    name: Platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/ci-platform-check.mjs
        working-directory: frontend
  frontend:
    name: Browser regression (Linux Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi 'pydantic>=2,<3' uvicorn httpx
      - run: npm ci
        working-directory: frontend
      - run: npm run check:names && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          retention-days: 7
